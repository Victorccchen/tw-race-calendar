name: 每日刷新與部署

on:
  schedule:
    # GitHub Actions 使用 UTC。台北 07:10 = 前一日 UTC 23:10
    - cron: '10 23 * * *'
  workflow_dispatch:        # 允許手動觸發

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write           # 需要把異動清單與快照 commit 回 repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 全部使用標準函式庫，無需 pip install

      - name: 抓取、比對、產出
        run: python3 refresh.py
        env:
          TZ: Asia/Taipei

      - name: 摘要
        run: |
          D=$(date +%F)
          echo "### 賽事異動 · $D" >> $GITHUB_STEP_SUMMARY
          if [ -f "data/changes/$D.md" ]; then
            tail -n +2 "data/changes/$D.md" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>待驗證佇列</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          [ -f "data/review/$D.md" ] && tail -n +2 "data/review/$D.md" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: 檢查產出物
        run: |
          set -e
          for f in web/public/index.html web/data/events.json; do
            [ -s "$f" ] || { echo "::error::產出物缺失或為空：$f"; exit 1; }
          done
          SIZE=$(wc -c < web/public/index.html)
          [ "$SIZE" -gt 500000 ] || { echo "::error::index.html 只有 ${SIZE} bytes，疑似空頁"; exit 1; }
          echo "index.html $((SIZE/1024)) KB · events.json $(($(wc -c < web/data/events.json)/1024)) KB"

      - name: 部署到 Vercel
        # 用官方 prebuilt 流程：先在 CI 建置成 .vercel/output 再上傳。
        # 直接 deploy 會套用 .gitignore 規則，把 refresh.py 剛產生的
        # web/public/index.html 排除掉，導致部署出空站台（alias 回 404）。
        run: |
          set -e
          cd web
          npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token "$VERCEL_TOKEN"
          [ -s .vercel/output/static/index.html ] \
            || { echo "::error::建置產物不含 index.html"; exit 1; }
          npx --yes vercel@latest deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 上線驗證
        # 部署成功不等於站台正常 —— 這一步會抓到空站台或壞掉的 ICS
        run: |
          set -e
          U=https://tw-race-calendar.vercel.app
          sleep 8
          for path in / /ics; do
            CODE=$(curl -s -o /tmp/r -w '%{http_code}' -m 30 "$U$path")
            SIZE=$(wc -c < /tmp/r)
            echo "$path → HTTP $CODE, ${SIZE} bytes"
            [ "$CODE" = "200" ] || { echo "::error::$path 回應 $CODE"; exit 1; }
          done
          grep -q 'BEGIN:VCALENDAR' /tmp/r || { echo "::error::/ics 不是合法行事曆"; exit 1; }
          echo "✅ 站台與 ICS 皆正常"

      - name: 回寫資料狀態
        run: |
          git config user.name  "race-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json data/changes data/review data/snapshots
          if git diff --staged --quiet; then
            echo "無資料變動，略過 commit"
          else
            git commit -m "資料刷新 $(date +%F)"
            git push
          fi
